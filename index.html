<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XUẤT SẢN PHẨM QR</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
  margin-bottom: 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

input[readonly] {
  background: #f1f5f9;
}

textarea {
  resize: vertical;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 14px;
  margin-top: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#scanButton {
  background: #111827;
  color: white;
}

.buttonRow {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.buttonRow button {
  flex: 1;
  margin-top: 0;
}

#submitButton {
  background: #2563eb;
  color: white;
}

#nextButton {
  background: #16a34a;
  color: white;
}

#submitButton:disabled,
#nextButton:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 10px;
}

#status {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  min-height: 24px;
}

.success {
  color: #15803d;
}

.error {
  color: #dc2626;
}

.info {
  color: #374151;
}

.hiddenFrame {
  display: none;
  width: 0;
  height: 0;
  border: 0;
}
</style>
</head>

<body>

<div class="container">

  <h1>XUẤT SẢN PHẨM QR</h1>

  <div class="card">

    <button
      id="scanButton"
      onclick="startScanner()">
      📷 QUÉT QR
    </button>

    <div id="reader"></div>

    <div
      id="status"
      class="info">
    </div>

  </div>

  <div class="card">

    <label>Mã sản phẩm</label>

    <input
      id="maSanPham"
      type="text"
      readonly>

    <label>Tên sản phẩm</label>

    <input
      id="tenSanPham"
      type="text"
      readonly>

    <label>Lô sản phẩm</label>

    <input
      id="loSanPham"
      type="text"
      readonly>

    <label>Đơn vị thùng</label>

    <input
      id="donViThung"
      type="text"
      readonly>

    <label>Số lượng xuất</label>

    <input
      id="soLuongXuat"
      type="number"
      min="1"
      inputmode="numeric">

    <label>Người yêu cầu</label>

    <input
      id="nguoiYeuCau"
      type="text"
      autocomplete="name">

    <label>Bộ phận</label>

    <input
      id="boPhan"
      type="text">

    <label>Ghi chú</label>

    <textarea
      id="ghiChu"
      rows="3"></textarea>

    <div class="buttonRow">

      <button
        id="submitButton"
        onclick="submitData()">
        GỬI DỮ LIỆU
      </button>

      <button
        id="nextButton"
        onclick="scanNextOrder()">
        QUÉT LỆNH TIẾP THEO
      </button>

    </div>

  </div>

</div>

<iframe
  id="submitFrame"
  name="submitFrame"
  class="hiddenFrame">
</iframe>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycby6at1PD83x1knfyIV9UYFd8-5uZMx8LrqLVrni1P2ot_RT6C4xku44fNeor83twkyy/exec';

let scanner = null;

let isScanning = false;

let waitingToken = null;

let submitTimeout = null;


function startScanner() {

  if (isScanning) {
    return;
  }

  const reader =
    document.getElementById('reader');

  reader.innerHTML = '';

  setStatus(
    'Đang mở camera...',
    'info'
  );

  scanner =
    new Html5Qrcode('reader');

  scanner.start(

    {
      facingMode: 'environment'
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      handleQRCode(decodedText);

    },

    function() {}

  )
  .then(function() {

    isScanning = true;

    setStatus(
      'Đưa QR vào khung camera.',
      'info'
    );

  })
  .catch(function(error) {

    isScanning = false;

    setStatus(
      '❌ Không thể mở camera. Hãy kiểm tra quyền Camera.',
      'error'
    );

    console.error(error);

  });

}


function handleQRCode(decodedText) {

  if (!scanner) {
    return;
  }

  scanner.stop()

    .then(function() {

      isScanning = false;

      processQRCode(decodedText);

    })

    .catch(function() {

      isScanning = false;

      processQRCode(decodedText);

    });

}


function processQRCode(text) {

  const parts =
    text
      .split('|')
      .map(function(item) {
        return item.trim();
      });

  const maSanPham =
    parts[0] || '';

  const tenSanPham =
    parts[1] || '';

  const loSanPham =
    parts[2] || '';

  const donViThung =
    parts[3] || '';

  if (!maSanPham) {

    setStatus(
      '❌ QR thiếu mã sản phẩm.',
      'error'
    );

    return;
  }

  document.getElementById(
    'maSanPham'
  ).value = maSanPham;

  document.getElementById(
    'tenSanPham'
  ).value = tenSanPham;

  document.getElementById(
    'loSanPham'
  ).value = loSanPham;

  document.getElementById(
    'donViThung'
  ).value = donViThung;

  setStatus(
    '✅ Đã quét QR thành công.',
    'success'
  );

  document.getElementById(
    'soLuongXuat'
  ).focus();

}


function submitData() {

  const maSanPham =
    document
      .getElementById('maSanPham')
      .value
      .trim();

  const tenSanPham =
    document
      .getElementById('tenSanPham')
      .value
      .trim();

  const loSanPham =
    document
      .getElementById('loSanPham')
      .value
      .trim();

  const donViThung =
    document
      .getElementById('donViThung')
      .value
      .trim();

  const soLuongXuat =
    document
      .getElementById('soLuongXuat')
      .value
      .trim();

  const nguoiYeuCau =
    document
      .getElementById('nguoiYeuCau')
      .value
      .trim();

  const boPhan =
    document
      .getElementById('boPhan')
      .value
      .trim();

  const ghiChu =
    document
      .getElementById('ghiChu')
      .value
      .trim();


  if (!maSanPham) {

    setStatus(
      '❌ Hãy quét QR trước.',
      'error'
    );

    return;
  }


  if (!soLuongXuat) {

    setStatus(
      '❌ Vui lòng nhập số lượng xuất.',
      'error'
    );

    return;
  }


  const quantity =
    Number(soLuongXuat);


  if (
    !Number.isFinite(quantity) ||
    quantity <= 0
  ) {

    setStatus(
      '❌ Số lượng xuất phải lớn hơn 0.',
      'error'
    );

    return;
  }


  if (!nguoiYeuCau) {

    setStatus(
      '❌ Vui lòng nhập người yêu cầu.',
      'error'
    );

    return;
  }


  if (!boPhan) {

    setStatus(
      '❌ Vui lòng nhập bộ phận.',
      'error'
    );

    return;
  }


  if (
    API_URL ===
    'PASTE_APPS_SCRIPT_URL_HERE'
  ) {

    setStatus(
      '❌ Chưa cấu hình URL Apps Script.',
      'error'
    );

    return;
  }


  const button =
    document.getElementById(
      'submitButton'
    );


  if (button.disabled) {
    return;
  }


  button.disabled = true;


  setStatus(
    '⏳ Đang lưu dữ liệu...',
    'info'
  );


  const token =
    Date.now().toString() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2);


  waitingToken = token;


  const form =
    document.createElement('form');


  form.method = 'POST';

  form.action = API_URL;

  form.target = 'submitFrame';

  form.style.display = 'none';


  appendHidden(
    form,
    'maSanPham',
    maSanPham
  );

  appendHidden(
    form,
    'tenSanPham',
    tenSanPham
  );

  appendHidden(
    form,
    'loSanPham',
    loSanPham
  );

  appendHidden(
    form,
    'donViThung',
    donViThung
  );

  appendHidden(
    form,
    'soLuongXuat',
    soLuongXuat
  );

  appendHidden(
    form,
    'nguoiYeuCau',
    nguoiYeuCau
  );

  appendHidden(
    form,
    'boPhan',
    boPhan
  );

  appendHidden(
    form,
    'ghiChu',
    ghiChu
  );

  appendHidden(
    form,
    'clientToken',
    token
  );


  document.body.appendChild(form);

  form.submit();

  document.body.removeChild(form);


  submitTimeout =
    setTimeout(
      function() {

        if (
          waitingToken === token
        ) {

          waitingToken = null;

          button.disabled = false;

          setStatus(
            '❌ Máy chủ không phản hồi.',
            'error'
          );

        }

      },
      15000
    );

}


function appendHidden(
  form,
  name,
  value
) {

  const input =
    document.createElement('input');

  input.type = 'hidden';

  input.name = name;

  input.value = value;

  form.appendChild(input);

}


function scanNextOrder() {

  if (waitingToken) {
    return;
  }

  if (isScanning) {
    return;
  }

  document.getElementById(
    'maSanPham'
  ).value = '';

  document.getElementById(
    'tenSanPham'
  ).value = '';

  document.getElementById(
    'loSanPham'
  ).value = '';

  document.getElementById(
    'donViThung'
  ).value = '';

  document.getElementById(
    'soLuongXuat'
  ).value = '';

  document.getElementById(
    'nguoiYeuCau'
  ).value = '';

  document.getElementById(
    'boPhan'
  ).value = '';

  document.getElementById(
    'ghiChu'
  ).value = '';

  document.getElementById(
    'submitButton'
  ).disabled = false;

  setStatus(
    'Đang chuẩn bị quét lệnh tiếp theo...',
    'info'
  );

  startScanner();

}


window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data;


    if (
      !data ||
      data.type !==
        'QR_SUBMIT_RESULT'
    ) {
      return;
    }


    if (!waitingToken) {
      return;
    }


    if (
      data.clientToken !==
      waitingToken
    ) {
      return;
    }


    if (submitTimeout) {

      clearTimeout(
        submitTimeout
      );

      submitTimeout = null;

    }


    waitingToken = null;


    const button =
      document.getElementById(
        'submitButton'
      );

    button.disabled = false;


    if (data.success) {

      setStatus(
        '✅ ' + data.message,
        'success'
      );


      document.getElementById(
        'maSanPham'
      ).value = '';


      document.getElementById(
        'tenSanPham'
      ).value = '';


      document.getElementById(
        'loSanPham'
      ).value = '';


      document.getElementById(
        'donViThung'
      ).value = '';


      document.getElementById(
        'soLuongXuat'
      ).value = '';


      document.getElementById(
        'nguoiYeuCau'
      ).value = '';


      document.getElementById(
        'boPhan'
      ).value = '';


      document.getElementById(
        'ghiChu'
      ).value = '';

    }

    else {

      setStatus(
        '❌ ' + data.message,
        'error'
      );

    }

  }
);


function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      'status'
    );

  status.innerText =
    message;

  status.className =
    type;

}

</script>

</body>
</html>
