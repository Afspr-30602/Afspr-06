<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quét QR kho Vật Tư</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
}

.container{
  width:100%;
  max-width:480px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:26px;
  margin:10px 0 22px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
  display:block;
  font-weight:bold;
  font-size:18px;
  margin-top:16px;
  margin-bottom:7px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:17px;
  background:#fff;
}

input[readonly]{
  background:#f1f5f9;
}

textarea{
  resize:vertical;
  min-height:90px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:16px;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#scanButton{
  background:#111827;
  color:#fff;
}

#submitButton{
  background:#2563eb;
  color:#fff;
}

#nextButton{
  background:#16a34a;
  color:#fff;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

#reader{
  width:100%;
  margin-top:15px;
  overflow:hidden;
  border-radius:12px;
}

#status{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  min-height:25px;
  font-size:17px;
}

.success{
  color:#15803d;
}

.error{
  color:#dc2626;
}

.info{
  color:#374151;
}

.hiddenFrame{
  display:none;
  width:0;
  height:0;
  border:0;
}
</style>
</head>

<body>

<div class="container">

<h1>QUÉT QR KHO VẬT TƯ</h1>

<div class="card">

<button
  id="scanButton"
  onclick="startScanner()">
  📷 QUÉT QR
</button>

<div id="reader"></div>

<div
  id="status"
  class="info">
</div>

</div>

<div class="card">

<label>Mã sản phẩm</label>
<input
  id="maSanPham"
  type="text"
  readonly>

<label>Tên sản phẩm</label>
<input
  id="tenSanPham"
  type="text"
  readonly>

<label>Lô sản phẩm</label>
<input
  id="loSanPham"
  type="text"
  readonly>

<label>Đơn vị thùng</label>
<input
  id="donViThung"
  type="text"
  readonly>

<label>Số lượng xuất</label>
<input
  id="soLuongXuat"
  type="number"
  min="1"
  inputmode="numeric">

<label>Người yêu cầu</label>
<input
  id="nguoiYeuCau"
  type="text"
  autocomplete="name">

<label>Bộ phận</label>
<input
  id="boPhan"
  type="text">

<label>Ghi chú</label>
<textarea
  id="ghiChu"
  rows="3"></textarea>

<button
  id="submitButton"
  onclick="submitData()">
  GỬI DỮ LIỆU
</button>

<button
  id="nextButton"
  onclick="nextOrder()">
  QUÉT LỆNH TIẾP THEO
</button>

</div>

</div>

<iframe
  id="submitFrame"
  name="submitFrame"
  class="hiddenFrame">
</iframe>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycby6at1PD83x1knfyIV9UYFd8-5uZMx8LrqLVrni1P2ot_RT6C4xku44fNeor83twkyy/exec';

let scanner=null;
let isScanning=false;
let isSubmitting=false;
let submitTimer=null;

function setStatus(message,type){

  const status=
    document.getElementById('status');

  status.textContent=message;
  status.className=type||'info';
}

function startScanner(){

  if(isScanning||isSubmitting){
    return;
  }

  const reader=
    document.getElementById('reader');

  reader.innerHTML='';

  setStatus(
    'Đang mở camera...',
    'info'
  );

  scanner=
    new Html5Qrcode('reader');

  scanner.start(
    {
      facingMode:'environment'
    },
    {
      fps:10,
      qrbox:{
        width:250,
        height:250
      }
    },
    function(decodedText){
      handleQRCode(decodedText);
    },
    function(){}
  )
  .then(function(){

    isScanning=true;

    setStatus(
      'Đưa QR vào khung camera.',
      'info'
    );

  })
  .catch(function(error){

    isScanning=false;

    setStatus(
      '❌ Không thể mở camera. Hãy kiểm tra quyền Camera.',
      'error'
    );

    console.error(error);

  });
}

function handleQRCode(decodedText){

  if(!scanner){
    return;
  }

  scanner.stop()
    .then(function(){

      isScanning=false;
      processQRCode(decodedText);

    })
    .catch(function(){

      isScanning=false;
      processQRCode(decodedText);

    });
}

function processQRCode(text){

  const parts=
    text
      .split('|')
      .map(function(item){
        return item.trim();
      });

  const maSanPham=
    parts[0]||'';

  const tenSanPham=
    parts[1]||'';

  const loSanPham=
    parts[2]||'';

  const donViThung=
    parts[3]||'';

  if(!maSanPham){

    setStatus(
      '❌ QR thiếu mã sản phẩm.',
      'error'
    );

    return;
  }

  document.getElementById(
    'maSanPham'
  ).value=maSanPham;

  document.getElementById(
    'tenSanPham'
  ).value=tenSanPham;

  document.getElementById(
    'loSanPham'
  ).value=loSanPham;

  document.getElementById(
    'donViThung'
  ).value=donViThung;

  setStatus(
    '✅ Đã quét QR thành công.',
    'success'
  );

  document.getElementById(
    'soLuongXuat'
  ).focus();
}

function addHiddenField(
  form,
  name,
  value
){

  const input=
    document.createElement('input');

  input.type='hidden';
  input.name=name;
  input.value=value;

  form.appendChild(input);
}

function submitData(){

  if(isSubmitting){
    return;
  }

  const maSanPham=
    document.getElementById(
      'maSanPham'
    ).value.trim();

  const tenSanPham=
    document.getElementById(
      'tenSanPham'
    ).value.trim();

  const loSanPham=
    document.getElementById(
      'loSanPham'
    ).value.trim();

  const donViThung=
    document.getElementById(
      'donViThung'
    ).value.trim();

  const soLuongXuat=
    document.getElementById(
      'soLuongXuat'
    ).value.trim();

  const nguoiYeuCau=
    document.getElementById(
      'nguoiYeuCau'
    ).value.trim();

  const boPhan=
    document.getElementById(
      'boPhan'
    ).value.trim();

  const ghiChu=
    document.getElementById(
      'ghiChu'
    ).value.trim();

  if(!maSanPham){

    setStatus(
      '❌ Hãy quét QR trước.',
      'error'
    );

    return;
  }

  if(!soLuongXuat){

    setStatus(
      '❌ Vui lòng nhập số lượng xuất.',
      'error'
    );

    return;
  }

  const quantity=
    Number(soLuongXuat);

  if(
    !Number.isFinite(quantity)||
    quantity<=0
  ){

    setStatus(
      '❌ Số lượng xuất phải lớn hơn 0.',
      'error'
    );

    return;
  }

  if(!nguoiYeuCau){

    setStatus(
      '❌ Vui lòng nhập người yêu cầu.',
      'error'
    );

    return;
  }

  if(!boPhan){

    setStatus(
      '❌ Vui lòng nhập bộ phận.',
      'error'
    );

    return;
  }

  isSubmitting=true;

  const submitButton=
    document.getElementById(
      'submitButton'
    );

  submitButton.disabled=true;

  setStatus(
    '⏳ Đang lưu dữ liệu...',
    'info'
  );

  const token=
    Date.now().toString()+
    '_' +
    Math.random()
      .toString(36)
      .substring(2);

  const frame=
    document.getElementById(
      'submitFrame'
    );

  let completed=false;

  frame.onload=function(){

    if(completed){
      return;
    }

    completed=true;

    if(submitTimer){
      clearTimeout(submitTimer);
      submitTimer=null;
    }

    isSubmitting=false;
    submitButton.disabled=false;

    setStatus(
      '✅ Đã lưu dữ liệu thành công!',
      'success'
    );

    document.getElementById(
      'soLuongXuat'
    ).value='';

    document.getElementById(
      'nguoiYeuCau'
    ).value='';

    document.getElementById(
      'boPhan'
    ).value='';

    document.getElementById(
      'ghiChu'
    ).value='';
  };

  const form=
    document.createElement('form');

  form.method='POST';
  form.action=API_URL;
  form.target='submitFrame';
  form.style.display='none';

  addHiddenField(
    form,
    'maSanPham',
    maSanPham
  );

  addHiddenField(
    form,
    'tenSanPham',
    tenSanPham
  );

  addHiddenField(
    form,
    'loSanPham',
    loSanPham
  );

  addHiddenField(
    form,
    'donViThung',
    donViThung
  );

  addHiddenField(
    form,
    'soLuongXuat',
    soLuongXuat
  );

  addHiddenField(
    form,
    'nguoiYeuCau',
    nguoiYeuCau
  );

  addHiddenField(
    form,
    'boPhan',
    boPhan
  );

  addHiddenField(
    form,
    'ghiChu',
    ghiChu
  );

  addHiddenField(
    form,
    'clientToken',
    token
  );

  document.body.appendChild(form);

  form.submit();

  document.body.removeChild(form);

  submitTimer=
    setTimeout(function(){

      if(completed){
        return;
      }

      completed=true;

      isSubmitting=false;
      submitButton.disabled=false;

      setStatus(
        '⚠️ Đã gửi dữ liệu. Hãy kiểm tra Dữ liệu QR.',
        'success'
      );

      document.getElementById(
        'soLuongXuat'
      ).value='';

      document.getElementById(
        'nguoiYeuCau'
      ).value='';

      document.getElementById(
        'boPhan'
      ).value='';

      document.getElementById(
        'ghiChu'
      ).value='';

    },5000);
}

function nextOrder(){

  if(isScanning||isSubmitting){
    return;
  }

  document.getElementById(
    'maSanPham'
  ).value='';

  document.getElementById(
    'tenSanPham'
  ).value='';

  document.getElementById(
    'loSanPham'
  ).value='';

  document.getElementById(
    'donViThung'
  ).value='';

  document.getElementById(
    'soLuongXuat'
  ).value='';

  document.getElementById(
    'nguoiYeuCau'
  ).value='';

  document.getElementById(
    'boPhan'
  ).value='';

  document.getElementById(
    'ghiChu'
  ).value='';

  setStatus(
    'Sẵn sàng quét lệnh tiếp theo.',
    'info'
  );

  startScanner();
}

</script>

</body>
</html>
